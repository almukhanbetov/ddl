# Reference Nginx site config for ddldecor.kz.
# Install this on the VPS at /etc/nginx/sites-available/ddldecor.kz,
# then symlink into sites-enabled and run certbot (see deploy/README.md).
#
# Path-based routing on one origin: /api and /uploads go to the Go
# backend, everything else goes to the Next.js frontend. Keeping both
# on the same origin avoids CORS and lets the admin cookie work
# without extra Domain/SameSite configuration.

server {
    listen 80;
    listen [::]:80;
    server_name ddldecor.kz www.ddldecor.kz;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
